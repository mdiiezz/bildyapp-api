services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      PUBLIC_URL: http://localhost:3000
      CORS_ORIGIN: "*"

      DB_URI: mongodb://mongo:27017/bildyapp

      JWT_SECRET: cambia_esto_por_un_secreto_largo_de_32_caracteres
      JWT_ACCESS_EXPIRES_IN: 15m
      REFRESH_TOKEN_DAYS: 7

      CLOUDINARY_CLOUD_NAME: ""
      CLOUDINARY_API_KEY: ""
      CLOUDINARY_API_SECRET: ""

      SLACK_WEBHOOK: ""

      MAIL_HOST: ""
      MAIL_PORT: 587
      MAIL_SECURE: "false"
      MAIL_USER: ""
      MAIL_PASS: ""
      MAIL_FROM: "BildyApp <no-reply@bildyapp.local>"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mongo_data: